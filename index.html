
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🎮 Rock Paper Scissors</h1>
        <p class="subtitle">Choose your move and beat the computer!</p>

        <div class="score-board">
            <div>
                <h2 id="user-score">0</h2>
                <p>You</p>
            </div>
            <div>
                <h2 id="computer-score">0</h2>
                <p>Computer</p>
            </div>
        </div>

        <h3>Make Your Choice</h3>

        <div class="choices">
            <button class="choice" onclick="playGame('rock')">✊<span>Rock</span></button>
            <button class="choice" onclick="playGame('paper')">✋<span>Paper</span></button>
            <button class="choice" onclick="playGame('scissors')">✌️<span>Scissors</span></button>
        </div>

        <div class="result-box">
            <p id="user-choice">Your choice: -</p>
            <p id="computer-choice">Computer choice: -</p>
            <h2 id="result">Let's Play!</h2>
        </div>

        <button class="reset-btn" onclick="resetGame()">Reset Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
